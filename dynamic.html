<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result</title>
</head>

<body>
    <h1>Student Result System</h1>
    <label>Student Name:</label>
    <input type="text" id="name">
    <br><br>
    <label>Subject 1:</label>
    <input type="number" id="mark1">
    <br><br>
    <label>Subject 2:</label>
    <input type="number" id="mark2">
    <br><br>

    <label>Subject 3:</label>
    <input type="number" id="mark3">

    <br><br>

    <button onclick="calculateResult()">Calculate Result</button>

    <h2 id="result"></h2>

    <script>

        function calculateResult() {

            let name = document.getElementById("name").value;

            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);

            let total = mark1 + mark2 + mark3;

            let average = total / 3;

            document.getElementById("result").innerHTML =
                "Student Name: " + name + "<br>" +
                "Total Marks: " + total + "<br>" +
                "Average: " + average;
        }
    </script>
</body>
</html>
